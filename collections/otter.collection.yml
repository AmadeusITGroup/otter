# yaml-language-server: $schema=https://raw.githubusercontent.com/AmadeusITGroup/ai-primitives-hub/refs/heads/main/packages/core/src/public/schemas/collection.schema.json
id: otter
name: Otter
description: Collection for Otter
items:
  - path: tools/llm/plugins/otter/skills/logic-placement/SKILL.md
    kind: skill
    title: Logic Placement
    description: Design-mode entry point deciding where application logic belongs, routing to the component shape, logic layer, and store implementation decision trees
    tags:
      - architecture
      - state-management
      - container-presenter
      - store
  - path: tools/llm/plugins/otter/skills/logic-review/SKILL.md
    kind: skill
    title: Logic Review
    description: Review-mode entry point detecting misplaced logic in existing components, services, and stores - presenter leaks, componentType mismatches, and wrong store variants
    tags:
      - architecture
      - review
      - anti-patterns
      - state-management
  - path: tools/llm/plugins/otter/skills/logic-component-shape/SKILL.md
    kind: skill
    title: Logic Decision Tree - Component Shape
    description: Decision tree for a single component versus a container/presenter pair, the componentStructure to generate, and the componentType to declare
    tags:
      - architecture
      - container-presenter
      - components
  - path: tools/llm/plugins/otter/skills/logic-state-layer/SKILL.md
    kind: skill
    title: Logic Decision Tree - Logic Layer
    description: Decision tree for whether logic belongs in the component class, an injectable service, or an NgRx store, including service scope and where API calls go
    tags:
      - architecture
      - state-management
      - services
  - path: tools/llm/plugins/otter/skills/logic-store-type/SKILL.md
    kind: skill
    title: Logic Decision Tree - Store Implementation
    description: Decision tree for which NgRx store variant to generate - entity or simple, sync or async - and what each one provides
    tags:
      - architecture
      - store
      - ngrx
  - path: tools/llm/plugins/otter/skills/otter-rules-engine/SKILL.md
    kind: skill
    title: Otter Rules Engine
    description: Author and debug rules-engine facts, operators, actions, and rulesets in an Otter workspace
    tags:
      - rules-engine
      - facts
      - operators
      - rulesets
  - path: tools/llm/plugins/otter/skills/otter-mcp-setup/SKILL.md
    kind: skill
    title: Otter MCP Setup
    description: Install and configure the @o3r/mcp MCP server for Claude Code and VS Code
    tags:
      - mcp
      - setup
      - configuration
  - path: tools/llm/plugins/otter/skills/otter-new-config/SKILL.md
    kind: skill
    title: Otter New Config
    description: Introduce new configuration flags (feature toggles, URLs, enums) in an Otter workspace with correct scope, safe defaults, and absence-detection patterns
    tags:
      - configuration
      - feature-toggle
      - schematics
  - path: tools/llm/plugins/otter/skills/otter-schematics/SKILL.md
    kind: skill
    title: Otter Schematics
    description: Create Angular artifacts (components, libraries, services, fixtures) using Otter schematics instead of manual file creation
    tags:
      - schematics
      - components
      - scaffolding
  - path: tools/llm/plugins/otter/skills/playwright-e2e-testing/SKILL.md
    kind: skill
    title: Playwright E2E Testing
    description: Write Playwright end-to-end tests following the Actions/Checks/Scenarios architecture and the mandatory 3-gate creation process
    tags:
      - playwright
      - e2e
      - testing
  - path: tools/llm/plugins/otter/skills/rxjs-vs-signals/SKILL.md
    kind: skill
    title: RxJS vs Angular Signals
    description: Choose between Angular Signals and RxJS Observables based on use case, with Otter-specific guidance for configuration, store, and rules engine
    tags:
      - signals
      - rxjs
      - observables
      - reactive
  - path: tools/llm/plugins/otter/agents/otter-migration.agent.md
    kind: agent
    title: Otter Migration
    description: Safely upgrade @o3r, @ama-mfe, and @ama-sdk packages across an Otter workspace, handling Angular peer-dependency upgrades and migration schematics
    tags:
      - migration
      - upgrade
      - angular
  - path: tools/llm/plugins/otter/agents/logic-design.agent.md
    kind: agent
    title: Logic Design
    description: Decide where new application logic belongs and return a placement recommendation with the schematic to run, stopping to ask when the choice is a trade-off the user owns
    tags:
      - architecture
      - design
      - state-management
  - path: tools/llm/plugins/otter/agents/logic-review.agent.md
    kind: agent
    title: Logic Review
    description: Review existing components, services, and stores for misplaced logic and report findings with the rule broken and the concrete fix
    tags:
      - architecture
      - review
      - state-management
readme:
  path: tools/llm/plugins/otter/README.md
display:
  ordering: manual
  show_badge: true
mcp:
  items:
    otter:
      command: npx
      args:
        - -y
        - -p
        - '@o3r/mcp@^15.0.0'
        - o3r-mcp-start

    angular:
      command: npx
      args:
        - -y
        - '@angular/cli@^22.0.0'
        - mcp

    playwright:
      command: npx
      args:
        - -y
        - '@playwright/mcp@~0.0.79'
